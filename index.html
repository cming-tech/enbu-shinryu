<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0204"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="炎舞神龍"><link rel="icon" href="assets/app_icon_192.png"><link rel="apple-touch-icon" href="assets/app_icon_180.png"></head><body>
<title>炎舞神龍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Orbitron:wght@900&family=Reggae+One&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/ui.css">

<div id="app">
  <header id="topbar">
    <button class="iconBtn" id="menuBtn" type="button"><i class="burger"></i></button>
    <div id="brand"><span class="crest" id="crest"></span><b id="title"></b></div>
    <div id="coins"><span data-t="ui.ballsTop"></span><b id="coinsVal">0</b></div>
  </header>
  <button id="dataBar" type="button" aria-expanded="false" aria-controls="dataPanel">
    <span data-t="ui.sinceHit"></span><b id="dbSince">0</b><i aria-hidden="true">·</i>
    <span data-t="ui.todayHits"></span><b id="dbToday">0</b><i aria-hidden="true">·</i>
    <span data-t="ui.totalSpins"></span><b id="dbTotal">0</b>
    <em class="chev" aria-hidden="true">▾</em>
  </button>
  <div id="dataPanel" hidden>
  <div id="counter">
    <div><span data-t="ui.serial"></span><b id="cSerial"></b></div>
    <div><span data-t="ui.sinceHit"></span><b id="cSince">0</b></div>
    <div><span data-t="ui.totalSpins"></span><b id="cTotal">0</b></div>
    <div><span data-t="ui.todayHits"></span><b id="cToday">0</b></div>
  </div>
  <div id="history">
    <div class="legend"><span data-t="ui.history"></span><i class="hN" data-t="ui.histNormal"></i><i class="hR" data-t="ui.histRush"></i><i class="hJ" data-t="ui.histJitan"></i></div>
    <div id="histBox"><ol id="histList"></ol><p id="histEmpty" data-t="ui.histEmpty" hidden></p></div>
  </div>
  </div>
  <main id="stageWrap">
    <div id="stage">
      <svg id="cabBack" xmlns="http://www.w3.org/2000/svg"></svg>
      <canvas id="field"></canvas>
      <div id="lcd"></div>
      <svg id="cabFront" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="ui">
        <svg id="knob" aria-hidden="true"></svg>
        <button id="handle" type="button"><i class="grip"></i><span class="pw" id="handlePw"></span><b id="handleBig"></b><span class="lbl" id="handleLbl"></span></button>
        <div id="knobHit" aria-hidden="true"></div>
        <button id="push" type="button" data-t="ui.push"></button>
        <div id="panel">
          <div class="oval"><span data-t="ui.balls"></span><b id="balls">0</b></div>
          <button id="autoBtn" type="button" aria-pressed="false"></button>
        </div>
        <button id="infoBtn" type="button" hidden>?</button>   <!-- 說明 is in the nav bar now -->
      </div>
    </div>
    <div id="caption" role="status" aria-live="polite"><b data-t="cap.tag"></b><span></span></div>
  </main>
  <div id="modeBar">
    <div class="mode"><span data-t="ui.fireMode"></span><div class="seg2" id="mFire"><button type="button" data-v="auto" data-t="ui.fireAuto"></button><button type="button" data-v="manual" data-t="ui.fireManual"></button></div></div>
    <div class="mode" id="mPowerBox"><span data-t="ui.powerMode"></span><div class="seg2" id="mPower"><button type="button" data-v="best" data-t="ui.powerBest"></button><button type="button" data-v="self" data-t="ui.powerSelf"></button></div></div>
    <button id="mSound" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
  </div>
  <nav id="navBar">
    <button type="button" data-go="mMissions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l2 2 3-3M11 7h9M4 13l2 2 3-3M11 14h9M5 20h15"/></svg><span data-t="nav.missions"></span></button>
    <button type="button" data-go="mRecords"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 20v-7M11 20V5M16 20v-10"/></svg><span data-t="nav.records"></span></button>
    <button type="button" data-go="mRefill" class="gold"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span data-t="nav.refill"></span></button>
    <button type="button" data-go="mGlossary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 17v.4"/></svg><span data-t="nav.help"></span></button>
    <button type="button" data-go="mSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span data-t="nav.settings"></span></button>
  </nav>
</div>

<div class="sheet" id="menu" hidden><div class="card">
  <h2 data-t="menu.title"></h2>
  <div class="list">
    <button class="big primary" id="mRefill" type="button" data-t="menu.refill" hidden></button>
    <button class="big" id="mLobby" type="button" data-t="menu.lobby"></button>
    <button class="big" id="mMissions" type="button" data-t="menu.missions" hidden></button>
    <button class="big" id="mRecords" type="button" data-t="menu.records" hidden></button>
    <button class="big" id="mGallery" type="button" data-t="menu.gallery"></button>
    <button class="big" id="mSettings" type="button" data-t="menu.settings" hidden></button>
    <button class="big" id="mGlossary" type="button" data-t="menu.glossary"></button>
    <button class="big" id="mTutorial" type="button" data-t="menu.tutorial"></button>
    <button class="big" data-close type="button" data-t="ui.close"></button>
  </div>
  <p class="ver" id="menuVer"></p>
</div></div>

<div class="sheet" id="settings" hidden><div class="card">
  <h2 data-t="set.title"></h2>
  <div class="setRow"><div data-t="set.sound"></div><button class="tog" id="sSound" type="button"></button></div>
  <div class="setRow"><div data-t="set.volume"></div><input type="range" id="sVolume" min="0" max="1" step="0.05"></div>
  <div class="setRow"><div><span data-t="set.captions"></span><small data-t="set.captionsHint"></small></div><button class="tog" id="sCaptions" type="button"></button></div>
  <div class="setRow"><div><span data-t="set.autoPush"></span><small data-t="set.autoPushHint"></small></div><button class="tog" id="sAuto" type="button"></button></div>
  <h3 data-t="set.display"></h3>
  <div class="setRow"><div><span data-t="set.saver"></span><small data-t="set.saverHint"></small></div><button class="tog" id="sSaver" type="button"></button></div>
  <div class="setRow col"><div><span data-t="set.wake"></span><small data-t="set.wakeHint"></small></div><div class="seg" id="sWake">
    <button type="button" data-min="0"></button><button type="button" data-min="5"></button><button type="button" data-min="15"></button><button type="button" data-min="30"></button><button type="button" data-min="60"></button>
  </div></div>
  <div class="setRow"><div><span data-t="set.remind"></span><small data-t="set.remindHint"></small></div><button class="tog" id="sRemind" type="button"></button></div>
  <div class="setRow"><div><span data-t="set.fps"></span><small data-t="set.fpsHint"></small></div><button class="tog" id="sFps" type="button"></button></div>
  <div class="setRow"><div><span data-t="set.voice"></span><small data-t="set.voiceHint"></small></div><button class="tog" id="sVoice" type="button"></button></div>
  <div class="setRow"><div data-t="set.speed"></div><div class="seg" id="sSpeed">
    <button type="button" data-speed="1" data-t="set.speed1"></button><button type="button" data-speed="1.6" data-t="set.speed2"></button><button type="button" data-speed="2.4" data-t="set.speed3"></button>
  </div></div>
  <h3 data-t="set.odds"></h3>
  <div class="setRow col"><div><span data-t="set.hit"></span><small id="sHitHint"></small></div><div class="seg odds" id="sHit"></div></div>
  <div class="setRow col"><div><span data-t="set.rush"></span><small id="sRushHint"></small></div><div class="seg odds" id="sRush"></div></div>
  <p class="note" data-t="set.oddsNote"></p>
  <button class="big primary" id="sOddsApply" type="button" data-t="set.oddsApply" hidden></button>
  <button class="big" id="sOddsDefault" type="button" data-t="set.oddsDefault" hidden></button>
  <div class="list" style="margin-top:14px">
    <div id="resetBox"><button class="big danger" id="sReset" type="button" data-t="set.reset"></button></div>
    <div id="resetAsk" hidden>
      <p id="resetQ"></p>
      <div class="tutBtns"><button class="big" id="sResetNo" type="button" data-t="set.resetNo"></button><button class="big danger" id="sResetYes" type="button" data-t="set.resetYes"></button></div>
    </div>
    <button class="big" data-close type="button" data-t="ui.close"></button>
  </div>
</div></div>

<div class="sheet" id="lobby" hidden><div class="card">
  <h2 data-t="lobby.title"></h2>
  <ul id="lobbyList"></ul>
  <p class="note" data-t="lobby.note"></p>
  <div class="list" style="margin-top:16px"><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div class="sheet" id="missions" hidden><div class="card">
  <h2 data-t="ms.title"></h2>
  <p class="lvl"><b id="msLevel"></b><span class="bar"><u id="msXp"></u></span><small id="msXpTxt"></small></p>
  <p class="note" id="msLogin"></p>
  <h3 data-t="ms.today"></h3>
  <ul id="msList" class="achList"></ul>
  <p class="note" data-t="ms.note"></p>
  <div class="list" style="margin-top:16px"><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div class="sheet" id="records" hidden><div class="card">
  <h2 data-t="rec.title"></h2>
  <h3 data-t="rec.slumpTitle"></h3>
  <canvas id="recSlump" class="slump" aria-hidden="true"></canvas>
  <p class="slumpCap" id="recSlumpCap"></p>
  <dl id="recStats"></dl>
  <h3 id="recAchHead"></h3>
  <ul id="recAch"></ul>
  <p class="note" data-t="rec.note"></p>
  <div class="list" style="margin-top:16px"><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div class="sheet" id="gallery" hidden><div class="card">
  <h2 data-t="ex.title"></h2>
  <h3 id="exHead"></h3>
  <ul id="exList"></ul>
  <p class="note" data-t="ex.note"></p>
  <div class="list" style="margin-top:16px"><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div class="sheet" id="glossary" hidden><div class="card">
  <h2 data-t="gl.title"></h2>
  <p data-t="gl.intro"></p>
  <div id="glList"></div>
  <p class="note" data-t="gl.credits"></p>
  <div class="list" style="margin-top:16px"><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div class="sheet" id="tutorial" hidden><div class="card">
  <div id="tutArt"></div>
  <p class="tutStep" id="tutStep"></p>
  <h2 id="tutTitle"></h2>
  <div class="tutBody" id="tutBody"></div>
  <div class="colors" id="tutColors" hidden></div>
  <p class="tutTip" id="tutTip" hidden><span aria-hidden="true">?</span><span data-t="tut.tip"></span></p>
  <div class="tutDots" id="tutDots"></div>
  <div class="tutBtns"><button class="big" id="tutPrev" type="button"></button><button class="big primary" id="tutNext" type="button"></button></div>
</div></div>

<div class="sheet" id="homeTip" hidden><div class="card">
  <h2 data-t="home.title"></h2>
  <p data-t="home.body"></p>
  <p class="note" data-t="home.ios"></p>
  <p class="note" data-t="home.android"></p>
  <div class="list" style="margin-top:16px"><button class="big primary" data-close type="button" data-t="home.ok"></button></div>
</div></div>

<div class="sheet" id="refill" hidden><div class="card">
  <h2 id="refillTitle" data-t="refill.title"></h2>
  <p id="refillBody"></p>
  <div class="list"><button class="big primary" id="refillBtn" type="button"></button><button class="big" data-close type="button" data-t="ui.close"></button></div>
</div></div>

<div id="toast" role="status" hidden></div>
<div id="fps" aria-hidden="true" hidden></div>

<script src="src/layout.js"></script>
<script src="src/text.js"></script>
<script src="src/machines.js"></script>
<script src="src/engine.js"></script>
<script src="src/cabinet.js"></script>
<script src="src/lcd.js"></script>
<script src="src/sound.js"></script>
<script src="src/shell.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script></body></html>
