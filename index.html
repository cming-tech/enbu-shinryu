<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0204"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="炎舞神龍"><link rel="icon" href="assets/app_icon_192.png"><link rel="apple-touch-icon" href="assets/app_icon_180.png"></head><body>
<title>炎舞神龍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Reggae+One&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone screen. Top bar and data counter, then the 588x860 machine stage scaled
     to fit; dialogs are bottom-up sheets. Single dark look (a machine in a dark hall). */
  :root {
    color-scheme: dark;
    --ground: #06070b;      /* hall floor behind the machine */
    --metal: #151922;       /* gunmetal panels */
    --metal-2: #1e2430;
    --line: #2f3747;
    --ink: #eef1f6;
    --dim: #98a1b3;
    --gold: #ffc94d;
    --fire: #ff6a2a;
    --ice: #5cbcff;
    --led: #ff9a2e;         /* data counter digits */
    --scrim: rgba(3, 4, 8, 0.74);
    --f-display: "Noto Serif TC", "Noto Sans TC", serif;                         /* titles: sharp Ming black, set at 900 */
    --f-num: "Dela Gothic One", "Noto Sans TC", "Arial Black", Impact, sans-serif;  /* digits and PUSH */
    --f-body: "Noto Sans TC", system-ui, "Arial Black", sans-serif;
  }
  html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--ground); }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink);
    font: 500 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }   /* also when the page is opened as a plain file */
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---- top bar */
  #topbar { flex: none; display: flex; align-items: center; gap: 10px; height: 46px;
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
    background: linear-gradient(180deg, var(--metal-2), var(--metal)); border-bottom: 1px solid var(--line); }
  .iconBtn { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--metal); display: grid; place-items: center; padding: 0; }
  .burger { width: 18px; height: 2px; background: var(--ink); box-shadow: 0 -6px 0 var(--ink), 0 6px 0 var(--ink); border-radius: 1px; }
  #brand { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .crest { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font: 900 18px/1 var(--f-display); color: #2a0b02;
    background: radial-gradient(circle at 35% 30%, #fff1b0, #ffc23d 42%, #e0620f 76%, #7a1d06);
    box-shadow: 0 0 0 2px #5a1a08, 0 0 14px rgba(255, 120, 30, 0.5); }
  #brand b { font: 900 23px/1 var(--f-display); letter-spacing: 3px; white-space: nowrap;
    background: linear-gradient(180deg, #fff3b8 0%, #ffc23d 48%, #ff6a1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #coins { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; min-width: 88px; }
  #coins span { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  #coins b { font: 15px/1.1 var(--f-num); color: var(--gold); font-variant-numeric: tabular-nums; }

  /* ---- data counter (the box above a real machine) */
  #counter { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
    margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); margin-top: 6px;
    background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #counter div { background: #0a0b0f; padding: 3px 4px 4px; text-align: center; min-width: 0; }
  #counter span { display: block; font-size: 10px; color: var(--dim); letter-spacing: 1px; white-space: nowrap; }
  #counter b { display: block; font: 17px/1.15 var(--f-num); color: var(--led); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 8px rgba(255, 140, 40, 0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 大當履歷: a bar per hit (spins it took), newest on the right, coloured by mode */
  #history { flex: none; display: flex; align-items: stretch; gap: 6px; height: 62px; min-width: 0;
    margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); margin-top: 4px; }
  #history .legend { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 3px; font: 900 10px/1 var(--f-body); color: var(--ink); }
  #history .legend span { color: var(--dim); letter-spacing: 1px; margin-bottom: 1px; }
  #history .legend i { font-style: normal; display: flex; align-items: center; gap: 4px; }
  #history .legend i::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
  #histList { flex: 1; min-width: 0; margin: 0; padding: 4px 4px 2px; list-style: none; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;
    background: #04060b; border: 1px solid var(--line); border-radius: 6px; }
  #histBox { flex: 1; min-width: 0; position: relative; display: flex; }
  #histEmpty { position: absolute; inset: 0 0 14px; margin: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px;
    text-align: center; font: 700 11px/1.35 var(--f-body); color: var(--dim); }
  #histList li { min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
  #histList li u { display: block; min-height: 3px; border-radius: 1px;
    background: repeating-linear-gradient(0deg, var(--c) 0 3px, rgba(0, 0, 0, 0) 3px 4px); box-shadow: 0 0 6px var(--c); }
  #histList li i { display: block; text-align: center; font: 700 9px/1.3 var(--f-body); font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #histList li.empty u { background: var(--line); box-shadow: none; }
  .hN { --c: #45e07a; } .hR { --c: #ff4a3a; } .hJ { --c: #ffd84a; }

  /* ---- machine stage (design units, scaled by the shell) */
  @property --amb { syntax: "<color>"; inherits: true; initial-value: rgba(40, 120, 255, 0.34); }
  #app { --amb: rgba(40, 120, 255, 0.34); transition: --amb 0.5s; }
  #app[data-theme="reach"] { --amb: rgba(255, 40, 40, 0.4); }
  #app[data-theme="hot"] { --amb: rgba(255, 140, 20, 0.44); }
  #app[data-theme="bonus"] { --amb: rgba(255, 190, 40, 0.42); }
  #app[data-theme="rush"] { --amb: rgba(130, 80, 255, 0.42); }
  #app[data-theme="rainbow"] { --amb: rgba(255, 60, 200, 0.42); }
  #app[data-theme="off"] { --amb: rgba(0, 0, 0, 0); }
  #stageWrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  /* the hall lights up behind the machine in its current colour */
  #stageWrap::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 55% at 50% 18%, var(--amb), rgba(0, 0, 0, 0) 75%),
      radial-gradient(ellipse 70% 30% at 50% 100%, var(--amb), rgba(0, 0, 0, 0) 80%); }
  #app[data-theme="rainbow"] #stageWrap::before { animation: hallHue 1.6s linear infinite; }
  @keyframes hallHue { to { filter: hue-rotate(360deg); } }
  #stage { position: absolute; left: 0; top: 0; width: 588px; height: 860px; transform-origin: 0 0; }
  #cabBack, #field, #cabFront { position: absolute; left: 0; top: 0; width: 588px; height: 860px; }
  #lcd { position: absolute; left: 104px; top: 150px; width: 392px; height: 320px; border-radius: 44px; overflow: hidden; }
  #ui { position: absolute; left: 0; top: 0; width: 588px; height: 860px; pointer-events: none; }
  #ui > * { pointer-events: auto; position: absolute; }

  /* Console controls; positions come from PK.L (set by the shell). */
  #handle { width: 132px; height: 132px; border-radius: 50%; border: 0; padding: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, #dff2ff 30%, #5cb4ff 62%, #1446b8 82%, #071a52 100%);
    box-shadow: inset 0 0 0 6px #d8e6f6, inset 0 0 0 11px #1a3a7a, 0 6px 14px rgba(0, 0, 0, 0.6); }
  #handle .grip { position: absolute; inset: 12px; border-radius: 50%; opacity: 0.55;
    background: repeating-conic-gradient(from 0deg, rgba(20, 70, 190, 0.55) 0 14deg, rgba(255, 255, 255, 0) 14deg 40deg); }
  #handle b { position: absolute; left: 0; right: 0; top: 44px; text-align: center; font: 30px/1 var(--f-num); color: #0a2a78;
    text-shadow: 0 0 6px #fff, 0 0 2px #fff; letter-spacing: 1px; }
  #handle .lbl { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font: 900 13px/1 var(--f-body); color: #0a2a78; text-shadow: 0 0 4px #fff; }
  #handle .pw { position: absolute; left: 0; right: 0; top: 22px; text-align: center; font: 900 12px/1 var(--f-body); color: #0a2a78; text-shadow: 0 0 4px #fff; }
  #knob { pointer-events: none; overflow: visible; }
  #knobHit { width: 180px; height: 180px; border-radius: 50%; touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* L.handle.r + 24 */
  /* the data bar: the key numbers in one line; tapping opens the full counter and the 大當履歷 */
  #dataBar { flex: none; display: flex; align-items: baseline; gap: 6px; margin: 6px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #0a0b0f; color: var(--dim); font-size: 12px; text-align: left; }
  #dataBar b { font: 16px/1 var(--f-num); color: var(--led); font-variant-numeric: tabular-nums; }
  #dataBar i { font-style: normal; color: var(--line); margin: 0 2px; }
  #dataBar .chev { margin-left: auto; font-style: normal; color: var(--dim); transition: transform 0.2s; }
  #dataBar[aria-expanded="true"] .chev { transform: rotate(180deg); }
  #dataPanel { flex: none; }
  /* the nav bar: the five things a player opens most, one tap each */
  #navBar { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, var(--metal), var(--metal-2)); border-top: 1px solid var(--line); }
  #navBar button { border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; font: 700 12px/1.2 var(--f-body); border-radius: 10px; }
  #navBar button:active { background: var(--metal-2); color: var(--ink); }
  #navBar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #navBar button.gold { color: var(--gold); }
  #mPowerBox.off { opacity: 0.45; }
  #settings .seg2 { flex: none; }
  .seg2 button { white-space: nowrap; }
  #modeBar { flex: none; display: flex; justify-content: center; align-items: center; gap: 12px;
    padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, var(--metal), var(--metal-2)); border-top: 1px solid var(--line); }
  #modeBar .mode { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-weight: 700; }
  #modeBar .mode.off { opacity: 0.45; }
  #modeBar .seg2 button { padding: 6px 12px; }
  @media (max-width: 380px) { #modeBar { gap: 6px; } #modeBar .mode { gap: 4px; } #modeBar .seg2 button { padding: 6px 9px; } }
  /* sound on/off, one tap (the volume stays in 設定) */
  #mSound { flex: none; width: 36px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--metal); color: var(--gold); display: grid; place-items: center; padding: 0; }
  #mSound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #mSound .off { display: none; }
  #mSound[aria-pressed="false"] { color: var(--dim); }
  #mSound[aria-pressed="false"] .on { display: none; }
  #mSound[aria-pressed="false"] .off { display: inline; }
  .seg2 { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg2 button { border: 0; background: var(--metal); color: var(--dim); padding: 7px 14px; font-weight: 900; font-size: 13px; }
  .seg2 button[aria-pressed="true"] { background: linear-gradient(#ffcf5a, #e08a12); color: #2a1500; }
  #knob.on #kFill { animation: kPulse .55s ease-in-out infinite alternate; }
  @keyframes kPulse { from { stroke-opacity: .65; } to { stroke-opacity: 1; stroke-width: 9; } }
  #kBurst { transform-box: fill-box; transform-origin: center; }
  #kBurst.go { animation: kBurst .5s ease-out; }
  @keyframes kBurst { from { transform: scale(1); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
  #handle.on { box-shadow: inset 0 0 0 6px #ffe08a, inset 0 0 0 11px #1a3a7a, 0 0 24px 5px rgba(90, 170, 255, 0.8); }
  #handle.on b { color: #b80c00; }
  #handle.on .grip { opacity: 0.9; animation: spinGrip 1.1s linear infinite; }
  @keyframes spinGrip { to { transform: rotate(360deg); } }

  #push { width: 116px; height: 102px; border: 0; padding: 0; border-radius: 36px 36px 48px 48px;
    background: linear-gradient(#ff6050, #a80c06); color: #fff; font: 30px/1 var(--f-num); letter-spacing: 1px;
    text-shadow: 0 2px 0 #600; box-shadow: inset 0 7px 0 rgba(255, 255, 255, 0.35), inset 0 -9px 0 rgba(0, 0, 0, 0.35), 0 6px 12px rgba(0, 0, 0, 0.6); }
  #push:active { transform: translateY(3px); box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.3), inset 0 -5px 0 rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.6); }
  #push.prompt { animation: pushPulse 0.5s ease-in-out infinite alternate; }
  @keyframes pushPulse { from { filter: brightness(1); } to { filter: brightness(1.45) drop-shadow(0 0 14px #ff3a20); } }

  #panel { width: 176px; height: 124px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #panel .oval { width: 172px; height: 80px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: radial-gradient(ellipse at 50% 30%, #4fe0c8 0%, #0f8f7c 45%, #04403a 100%);
    box-shadow: inset 0 0 0 3px #ffe08a, inset 0 0 0 5px #6a4a10, inset 0 6px 10px rgba(255, 255, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.6); }
  #panel span { font: 900 18px/1 var(--f-display); color: #fff6c8; letter-spacing: 3px; text-shadow: 0 2px 2px #022; }
  #balls { font: 26px/1 var(--f-num); color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 3px #022; }
  #autoBtn { width: 132px; height: 34px; border-radius: 999px; border: 1px solid #c8961e;
    background: linear-gradient(#3a2c10, #120c04); font: 900 15px/1 var(--f-body); color: #ffe08a; letter-spacing: 2px; }
  #autoBtn[aria-pressed="true"] { background: linear-gradient(#ffcf5a, #c07a10); color: #2a1500; }
  #infoBtn { left: 528px; top: 646px; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #8a96ac;
    background: radial-gradient(circle at 40% 35%, #3a4458, #121722); font: 24px/1 var(--f-num); color: #fff; padding: 0; }

  /* ---- 提示字幕 */
  #caption { position: absolute; top: 8px; left: max(8px, env(safe-area-inset-left, 0px)); max-width: min(78%, 360px); z-index: 5;
    padding: 7px 12px; border-radius: 10px; background: rgba(8, 10, 16, 0.86); border: 1px solid var(--gold);
    font: 700 14px/1.4 var(--f-body); color: var(--ink); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    opacity: 0; transform: translateY(-6px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  #caption.show { opacity: 1; transform: none; }
  #caption b { display: inline-block; margin-right: 8px; padding: 0 6px; border-radius: 4px;
    background: var(--gold); color: #2a1500; font-size: 11px; vertical-align: 1px; }

  #fps { position: fixed; left: 6px; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 31; padding: 2px 6px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.6); color: #7dff9a; font: 700 11px/1.3 ui-monospace, monospace; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
    padding: 9px 16px; border-radius: 999px; background: var(--metal-2); border: 1px solid var(--gold); color: var(--gold); font-weight: 700; }

  /* ---- sheets (menu, settings, help, tutorial, refill) */
  .sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .card { width: 100%; max-width: 440px; max-height: calc(100% - 40px); overflow-y: auto; -webkit-user-select: text; user-select: text;
    margin-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding: 16px 16px 18px; border-radius: 16px 16px 12px 12px;
    background: linear-gradient(180deg, var(--metal-2), var(--metal)); border: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6); }
  .card { border-top: 1px solid var(--gold); }
  .card h2 { margin: 0 0 14px; padding-bottom: 8px; font: 900 22px/1.25 var(--f-display); color: var(--gold); letter-spacing: 2px; text-wrap: balance;
    background: linear-gradient(90deg, var(--gold), rgba(255, 201, 77, 0)) bottom left / 70% 1px no-repeat; }
  .card p { margin: 0 0 12px; color: var(--ink); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .ver { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--dim); }
  .big { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--metal);
    font: 700 16px/1.2 var(--f-body); text-align: left; padding: 0 16px; }
  .big.primary { background: linear-gradient(#ffcf5a, #e08a12); border-color: #ffd86e; color: #2a1500; text-align: center; font-weight: 900; }
  .big.danger { color: #ff8a7a; }
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .setRow > div { min-width: 0; }
  .setRow small { display: block; color: var(--dim); font-size: 12px; }
  .tog { flex: none; min-width: 64px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--metal); font-weight: 700; color: var(--dim); }
  .tog[aria-pressed="true"] { background: linear-gradient(#ffcf5a, #e08a12); border-color: #ffd86e; color: #2a1500; }
  .seg { flex: none; display: flex; gap: 4px; }
  .seg button { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--metal); color: var(--dim); font-weight: 700; }
  .setRow.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .seg.odds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .seg.odds button { padding: 0 2px; font-size: 14px; }
  #sOddsApply, #sOddsDefault { margin-top: 10px; font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--ice); border-color: var(--ice); color: #04203a; }
  input[type="range"] { flex: none; width: 140px; accent-color: var(--gold); }
  #glList h3, #records h3, #settings h3 { margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
    font: 900 17px/1.3 var(--f-display); color: var(--ice); letter-spacing: 1px; }
  .flow { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
  .flow li { padding: 4px 9px; border-radius: 999px; background: var(--metal); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .flow li.arrow { padding: 0; background: none; border: 0; color: var(--gold); }
  dl { margin: 0; display: grid; grid-template-columns: 6.8em minmax(0, 1fr); gap: 8px 12px; }   /* same term column in every group */
  dt { font: 900 14px/1.5 var(--f-body); color: var(--gold); }
  dd { margin: 0; color: var(--ink); min-width: 0; }
  @media (max-width: 360px) { dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } dd { margin-bottom: 8px; } }
  #recStats { grid-template-columns: 8.5em minmax(0, 1fr); }
  /* 珠子走勢 (the slump graph of a real data counter) */
  .slump { display: block; width: 100%; height: 130px; border-radius: 10px; background: #04060b; border: 1px solid var(--line); }
  .slumpCap { margin: 6px 0 14px; font-size: 12px; color: var(--dim); }
  #recAch { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  #recAch li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: var(--metal); border: 1px solid var(--line); }
